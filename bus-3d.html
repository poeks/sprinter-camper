<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>De bus — 3D</title>
<style>
  :root { color-scheme: light; }
  html, body { margin: 0; height: 100%; overflow: hidden; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
  #app {
    position: relative; width: 100%; height: 100vh;
    background: radial-gradient(120% 120% at 50% 18%, #dff0fb 0%, #cfe6f4 38%, #e7dcc2 100%);
  }
  #scene { width: 100%; height: 100%; display: block; }
  .hint {
    position: absolute; left: 50%; bottom: 22px; transform: translateX(-50%);
    background: rgba(30,34,28,0.55); color: #fff; font-size: 13px; font-weight: 500;
    padding: 8px 16px; border-radius: 999px; letter-spacing: .02em;
    backdrop-filter: blur(6px); pointer-events: none; user-select: none;
    opacity: 0; transition: opacity .6s ease; white-space: nowrap;
  }
  .hint.show { opacity: 1; }
  .badge {
    position: absolute; top: 20px; left: 20px; pointer-events: none; user-select: none;
  }
  .badge b { display: block; font-size: 17px; color: #2b3326; letter-spacing: .01em; }
  .badge span { font-size: 12px; color: #5d6b50; font-weight: 600; text-transform: uppercase; letter-spacing: .12em; }
  .loading {
    position: absolute; inset: 0; display: grid; place-items: center;
    font-size: 14px; color: #5d6b50; font-weight: 600; letter-spacing: .04em;
  }
</style>
</head>
<body>
<div id="app">
  <div class="badge"><b>Mercedes Sprinter camper</b><span>off-grid · avontuur</span></div>
  <div class="loading" id="loading">3D laden…</div>
  <canvas id="scene"></canvas>
  <div class="hint" id="hint">↻ sleep om de bus te draaien</div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const canvas = document.getElementById('scene');
const app = document.getElementById('app');

// ---- Renderer ----
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
renderer.outputColorSpace = THREE.SRGBColorSpace;

// ---- Scene & camera ----
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(42, 1, 0.1, 100);
camera.position.set(7.2, 4.2, 8.4);

const controls = new OrbitControls(camera, canvas);
controls.target.set(0, 1.35, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.enablePan = false;
controls.minDistance = 6;
controls.maxDistance = 18;
controls.minPolarAngle = 0.25;
controls.maxPolarAngle = Math.PI / 2 - 0.04;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.9;
controls.addEventListener('start', () => { controls.autoRotate = false; });

// ---- Lights ----
const hemi = new THREE.HemisphereLight(0xeaf4ff, 0x8a7f5e, 0.85);
scene.add(hemi);

const key = new THREE.DirectionalLight(0xfff3da, 2.1);
key.position.set(6, 9, 5);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
key.shadow.camera.near = 1;
key.shadow.camera.far = 40;
key.shadow.camera.left = -9;
key.shadow.camera.right = 9;
key.shadow.camera.top = 9;
key.shadow.camera.bottom = -9;
key.shadow.bias = -0.0004;
scene.add(key);

const fill = new THREE.DirectionalLight(0xbfd8ff, 0.5);
fill.position.set(-7, 4, -4);
scene.add(fill);

// ---- Ground shadow catcher ----
const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(60, 60),
  new THREE.ShadowMaterial({ opacity: 0.26 })
);
ground.rotation.x = -Math.PI / 2;
ground.receiveShadow = true;
scene.add(ground);

// ---- Procedural camouflage texture ----
function makeCamoTexture() {
  const c = document.createElement('canvas');
  c.width = c.height = 512;
  const ctx = c.getContext('2d');
  ctx.fillStyle = '#b9a96d';                       // zandkleurige basis
  ctx.fillRect(0, 0, 512, 512);
  const cols = ['#717b46', '#4e5734', '#7d6b4d', '#2c2b23']; // olijf, donkergroen, bruin, bijna-zwart
  for (let i = 0; i < 64; i++) {
    ctx.fillStyle = cols[(Math.random() * cols.length) | 0];
    blob(ctx, Math.random() * 512, Math.random() * 512, 28 + Math.random() * 72);
  }
  const t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.colorSpace = THREE.SRGBColorSpace;
  return t;
}
function blob(ctx, x, y, r) {
  const pts = 9;
  ctx.beginPath();
  for (let i = 0; i <= pts; i++) {
    const a = (i / pts) * Math.PI * 2;
    const rr = r * (0.6 + Math.random() * 0.6);
    const px = x + Math.cos(a) * rr;
    const py = y + Math.sin(a) * rr;
    i ? ctx.lineTo(px, py) : ctx.moveTo(px, py);
  }
  ctx.closePath();
  ctx.fill();
}
const camoTex = makeCamoTexture();
function camoMat(rx = 1, ry = 1) {
  const t = camoTex.clone();
  t.needsUpdate = true;
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.repeat.set(rx, ry);
  t.offset.set(Math.random(), Math.random());
  return new THREE.MeshStandardMaterial({ map: t, roughness: 0.92, metalness: 0.04 });
}

// ---- Shared materials ----
const glassMat = new THREE.MeshStandardMaterial({ color: 0x1b2228, roughness: 0.12, metalness: 0.4, transparent: true, opacity: 0.85 });
const tireMat  = new THREE.MeshStandardMaterial({ color: 0x161616, roughness: 0.95 });
const rimMat   = new THREE.MeshStandardMaterial({ color: 0x9aa0a6, roughness: 0.4, metalness: 0.7 });
const trimMat  = new THREE.MeshStandardMaterial({ color: 0x2f3331, roughness: 0.7 });
const lightMat = new THREE.MeshStandardMaterial({ color: 0xfff3cf, emissive: 0xffe9a8, emissiveIntensity: 0.7, roughness: 0.3 });
const solarMat = new THREE.MeshStandardMaterial({ color: 0x16243f, roughness: 0.25, metalness: 0.5 });
const starMat  = new THREE.MeshStandardMaterial({ color: 0xd9dde1, roughness: 0.3, metalness: 0.85 });

// ---- Build the van ----
// As-stelsel: x = lengte (-front .. +achter), y = hoogte, z = breedte
const van = new THREE.Group();

function box(w, h, d, mat, x, y, z, rotZ = 0) {
  const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat);
  m.position.set(x, y, z);
  if (rotZ) m.rotation.z = rotZ;
  van.add(m);
  return m;
}

// Hoofdcarrosserie (cabine + onderbak)
box(5.4, 1.5, 2.0, camoMat(3, 1.5), 0, 1.30, 0);
// Hoogdak achter
box(3.4, 1.05, 1.9, camoMat(2.2, 1.2), 0.7, 2.575, 0);
// Lage motorkap-lip vooraan (laat grille/koplampen vrij)
box(0.42, 0.55, 1.96, camoMat(1, 1), -2.86, 0.80, 0, -0.12);

// Glas
box(0.08, 0.92, 1.78, glassMat, -2.34, 1.82, 0, -0.38);              // voorruit (gehoekt)
box(1.25, 0.62, 0.06, glassMat, -1.95, 1.70, 1.005);                 // zijraam cabine R
box(1.25, 0.62, 0.06, glassMat, -1.95, 1.70, -1.005);
box(1.5, 0.85, 0.06, glassMat, 0.55, 1.65, 1.005);                   // camper-zijraam R
box(1.5, 0.85, 0.06, glassMat, 0.55, 1.65, -1.005);
box(0.08, 1.0, 1.5, glassMat, 2.715, 1.75, 0);                       // achterruit/deuren

// Bumpers
box(0.3, 0.42, 2.05, trimMat, -2.95, 0.6, 0);                        // voor
box(0.3, 0.42, 2.05, trimMat, 2.78, 0.62, 0);                        // achter
// Sideskirt-trim
box(5.0, 0.18, 2.04, trimMat, 0, 0.62, 0);

// Grille + koplampen (op het voorvlak)
box(0.06, 0.5, 1.15, trimMat, -2.74, 1.42, 0);                       // grille
box(0.14, 0.3, 0.5, lightMat, -2.75, 1.14, 0.6);                     // koplamp R
box(0.14, 0.3, 0.5, lightMat, -2.75, 1.14, -0.6);
box(0.16, 0.16, 0.2, new THREE.MeshStandardMaterial({color:0xff7a2e,emissive:0xff6a1a,emissiveIntensity:0.5,roughness:0.4}), 2.86, 1.55, 0.78); // achterlicht R
box(0.16, 0.16, 0.2, new THREE.MeshStandardMaterial({color:0xff7a2e,emissive:0xff6a1a,emissiveIntensity:0.5,roughness:0.4}), 2.86, 1.55, -0.78);

// Mercedes-ster op de neus
const star = new THREE.Group();
const ring = new THREE.Mesh(new THREE.TorusGeometry(0.17, 0.022, 12, 32), starMat);
star.add(ring);
for (let i = 0; i < 3; i++) {
  const spoke = new THREE.Mesh(new THREE.BoxGeometry(0.015, 0.16, 0.02), starMat);
  spoke.position.y = 0.08;
  const pivot = new THREE.Group();
  pivot.add(spoke);
  pivot.rotation.z = (i * 2 * Math.PI) / 3;
  star.add(pivot);
}
star.rotation.y = Math.PI / 2;
star.position.set(-2.78, 1.78, 0);
van.add(star);

// Zonnepaneel op het dak (knipoog naar de Victron-setup)
const solar = box(2.7, 0.07, 1.45, solarMat, 0.7, 3.14, 0);
for (let i = -1; i <= 1; i++) {                                      // celverdeling
  box(2.7, 0.075, 0.02, trimMat, 0.7, 3.142, i * 0.45);
}
box(0.02, 0.075, 1.45, trimMat, -0.6, 3.142, 0);
box(0.02, 0.075, 1.45, trimMat, 1.9, 3.142, 0);
// Daklucht-/kachelpijpje
box(0.18, 0.16, 0.18, trimMat, -1.5, 2.13, 0.5);

// Wielen
function wheel(x, z) {
  const g = new THREE.Group();
  const tire = new THREE.Mesh(new THREE.CylinderGeometry(0.46, 0.46, 0.34, 28), tireMat);
  tire.rotation.x = Math.PI / 2;
  tire.castShadow = true;
  g.add(tire);
  const rim = new THREE.Mesh(new THREE.CylinderGeometry(0.24, 0.24, 0.36, 18), rimMat);
  rim.rotation.x = Math.PI / 2;
  g.add(rim);
  const hub = new THREE.Mesh(new THREE.CylinderGeometry(0.07, 0.07, 0.38, 10), trimMat);
  hub.rotation.x = Math.PI / 2;
  g.add(hub);
  g.position.set(x, 0.46, z);
  van.add(g);
}
wheel(-1.65, 1.02); wheel(-1.65, -1.02);
wheel(1.75, 1.02);  wheel(1.75, -1.02);

// Wielkasten (donkere boog-aanzet)
[-1.65, 1.75].forEach(x => {
  box(1.25, 0.5, 2.06, trimMat, x, 0.7, 0);
});

van.traverse(o => { if (o.isMesh) { o.castShadow = true; o.receiveShadow = true; } });
scene.add(van);

// ---- Resize ----
function resize() {
  const w = app.clientWidth, h = app.clientHeight;
  renderer.setSize(w, h, false);
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
}
window.addEventListener('resize', resize);
resize();

// ---- UI ----
document.getElementById('loading').style.display = 'none';
const hint = document.getElementById('hint');
setTimeout(() => hint.classList.add('show'), 400);
controls.addEventListener('start', () => hint.classList.remove('show'));

// ---- Animate ----
const clock = new THREE.Clock();
function tick() {
  const t = clock.getElapsedTime();
  van.position.y = Math.sin(t * 1.3) * 0.035;   // speels zweven
  controls.update();
  renderer.render(scene, camera);
  requestAnimationFrame(tick);
}
tick();
</script>
</body>
</html>
